<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Project placeholder image</title>
  <desc id="desc">Navy gradient placeholder with a centered label for project previews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1327" />
      <stop offset="55%" stop-color="#101d3a" />
      <stop offset="100%" stop-color="#1d2a4d" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(201, 175, 103, 0.16)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <rect x="210" y="210" width="780" height="255" rx="18" fill="rgba(10, 17, 33, 0.55)" stroke="rgba(201, 175, 103, 0.45)" stroke-width="2" />
  <text x="600" y="320" text-anchor="middle" fill="#f1eee2" font-size="52" font-family="Georgia, serif" font-weight="700">
    Project Preview
  </text>
  <text x="600" y="378" text-anchor="middle" fill="rgba(241, 238, 226, 0.82)" font-size="26" font-family="'Courier New', monospace">
    Replace this with your real screenshot
  </text>
</svg>
